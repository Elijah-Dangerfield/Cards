# detekt config for the Cards custom ruleset (ENG-2).
#
# detekt's built-in rule sets are turned off in build.gradle.kts
# (disableDefaultRuleSets = true) — this file only configures the custom
# `cards` rules from :detekt-rules. Adding a rule = a new entry here plus a
# constructor reference in CardsRuleSetProvider.
cards:
  active: true
  VerifyStrings:
    active: true
    # The config admin tool (:apps:admin) is a local-only, English-only dev
    # utility with no :libraries:resources dependency — the i18n rule doesn't
    # apply. Its `Text(...)` is Compose HTML's, not the DS composable anyway.
    excludes: ['**/apps/admin/**']
  AnimatedStateReadInComposition:
    active: true
