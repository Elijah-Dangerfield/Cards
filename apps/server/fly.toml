# Fly.io configuration for the Cards dev server.
#
# Generated manually (not via `fly launch` — it asks questions that don't
# apply to our setup since Postgres lives on Supabase, not Fly).
#
# Workflow:
#   - Local first-time deploy:  fly deploy --config apps/server/fly.toml
#   - Secrets:                  fly secrets set KEY=VALUE -a cards-server-dev
#   - Live logs:                fly logs -a cards-server-dev
#   - Console (running VM):     fly ssh console -a cards-server-dev
#   - Status:                   fly status -a cards-server-dev
#
# Production gets its own fly.toml (cards-server) when we ship.

app = 'cards-server-dev'
primary_region = 'iad'   # US East — closest to Supabase's default `aws-0-us-east-1` pool.

[build]
  dockerfile = 'Dockerfile'

[env]
  SERVER_HOST = '0.0.0.0'
  SERVER_PORT = '8080'
  LOG_LEVEL = 'INFO'
  # JVM heap tuned for a 512MB machine. The Ktor + Exposed + Hikari +
  # OkHttp/OTel dependency set has a ~150-200MB off-heap floor (metaspace,
  # thread stacks, JIT code cache, Netty/OkHttp direct buffers) before the
  # heap is counted at all — so 256MB total OOM-killed the JVM in a restart
  # loop (observed 2026-05-30). 256m heap + 96m metaspace cap leaves ~150MB
  # for off-heap + OS on the 512MB box.
  JAVA_OPTS = '-Xms64m -Xmx256m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -XX:+UnlockExperimentalVMOptions'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm 24/7. The earlier scale-to-zero config saved
  # a couple bucks a month but the cold-start tax (6+s end-to-end on
  # JVM boot, observed 2026-05-23 on a fresh-install device log) was
  # eating the AppConfig refresh 5s timeout and dragging the first
  # /v1/me roundtrip well past the splash gate's threshold. Idle
  # machines past the first one still auto-stop, so we don't pay for
  # extra capacity — just the always-warm baseline. Same shape will
  # carry to the prod fly.toml when we ship.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/_health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
