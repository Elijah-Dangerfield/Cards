[versions]
agp = "8.13.2"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.18.0"
androidx-core-splashscreen = "1.2.0"
# Pinned to the resolved androidx.compose.runtime version. Composition tracing
# instruments the runtime, so a mismatch here is a silent no-op at best.
androidx-composeRuntimeTracing = "1.11.1"
# The error message names the version it wants, so it is pinned rather than ranged.
androidx-tracingPerfetto = "1.0.1"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.10.0"
android-lifecycle-etx = "2.2.0"
androidx-testExt = "1.3.0"
androidx-security-crypto = "1.1.0"
androidx-work = "2.11.2"
atomicfu = "0.32.1"
composeMultiplatform = "1.11.0"
compottie="2.1.0"
# SKIE's annotations artifact — keep in lockstep with the skie plugin
# version in apps/compose/build.gradle.kts.
configurationAnnotations = "0.10.13"
buildconfig = "6.0.9"
junit = "4.13.2"
kermit = "2.1.0"
# 2.4.0 halves linkRelease* memory (KT-80367) and fixes the 2.3.x iOS
# release-link time regression (KT-84412). Held at .0 (not 2.4.10) because
# SKIE 0.10.13 only lists 2.4.0 in its supported matrix — bump both together.
kotlin = "2.4.0"
kotlinxSerializationJson = "1.11.0"
ksp = "2.3.10"
kotlinInject = "0.9.0"
kotlinx-serialization = "1.9.0"
kotlinxCoroutinesCore = "1.11.0"
kotlinxDatetime = "0.8.0"
ktor = "3.5.0"
jetbrainsNavigationCompose = "2.9.2"
kotlinInjectAnvil = "0.1.7"
composeIcons = "1.1.1"
room = "2.8.4"
sqlite = "2.6.2"
datastore = "1.2.1"
detekt = "2.0.0-alpha.6"
roomGradlePlugin = "2.8.4"
sentryKmp = "0.26.0"
supabaseKt = "3.6.0"
lifecycleProcess = "2.10.0"
turbine = "1.2.1"
wiretap = "1.0.0-RC15"
postgresJdbc = "42.7.4"
hikariCp = "5.1.0"
exposed = "0.56.0"
flyway = "10.20.0"
testcontainers = "1.20.4"
auth0Jwt = "4.4.0"
auth0JwksRsa = "0.22.1"
appStoreServerLibrary = "5.2.0"
googleApiAndroidPublisher = "v3-rev20260528-2.0.0"
googleAuthLibrary = "1.30.1"
opentelemetry = "1.45.0"
# Instrumentation modules track a separate alpha train aligned with the
# stable SDK release (`<sdk>-alpha`).
opentelemetryInstrumentation = "2.11.0-alpha"
# KMP client-side OTel (io.opentelemetry.kotlin) — experimental, pinned exactly.
# Distinct from the server's JVM `opentelemetry` entries above.
opentelemetryKotlin = "0.5.0"
okio = "3.9.1"
robolectric = "4.14.1"
androidxComposeUiTestManifest = "1.9.4"

[libraries]
anvil-compiler = { module = "software.amazon.lastmile.kotlin.inject.anvil:compiler", version.ref = "kotlinInjectAnvil" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
configuration-annotations = { module = "co.touchlab.skie:configuration-annotations", version.ref = "configurationAnnotations" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlin-inject-compiler-ksp = { module = "me.tatarka.inject:kotlin-inject-compiler-ksp", version.ref = "kotlinInject" }
kotlin-inject-runtime-kmp = { module = "me.tatarka.inject:kotlin-inject-runtime-kmp", version.ref = "kotlinInject" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }
compose-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-uiTestManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidxComposeUiTestManifest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-compose-runtimeTracing = { module = "androidx.compose.runtime:runtime-tracing", version.ref = "androidx-composeRuntimeTracing" }
androidx-tracing-perfetto = { module = "androidx.tracing:tracing-perfetto", version.ref = "androidx-tracingPerfetto" }
androidx-tracing-perfettoBinary = { module = "androidx.tracing:tracing-perfetto-binary", version.ref = "androidx-tracingPerfetto" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesCore" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
ktor-serverCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-serverNetty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-serverTestHost = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Server-side data layer (JVM only).
postgres-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresJdbc" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikariCp" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
testcontainers-postgres = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
auth0-jwt = { module = "com.auth0:java-jwt", version.ref = "auth0Jwt" }
auth0-jwksRsa = { module = "com.auth0:jwks-rsa", version.ref = "auth0JwksRsa" }

# IAP receipt validation — official Apple + Google server libraries (BILL-2).
# JVM-only, server-side. Stay dormant until their credentials are configured.
appStoreServerLibrary = { module = "com.apple.itunes.storekit:app-store-server-library", version.ref = "appStoreServerLibrary" }
google-api-androidpublisher = { module = "com.google.apis:google-api-services-androidpublisher", version.ref = "googleApiAndroidPublisher" }
google-auth-oauth2 = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "googleAuthLibrary" }

# OpenTelemetry — traces + logs SDK + OTLP/stdout exporters. The
# Logback bridge ships on the alpha instrumentation train but the SDK
# itself is stable.
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-sdk-logs = { module = "io.opentelemetry:opentelemetry-sdk-logs", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-exporter-logging = { module = "io.opentelemetry:opentelemetry-exporter-logging", version.ref = "opentelemetry" }
opentelemetry-exporter-logging-otlp = { module = "io.opentelemetry:opentelemetry-exporter-logging-otlp", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
opentelemetry-extension-kotlin = { module = "io.opentelemetry:opentelemetry-extension-kotlin", version.ref = "opentelemetry" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetryInstrumentation" }
otel-kotlin-api = { module = "io.opentelemetry.kotlin:api", version.ref = "opentelemetryKotlin" }
otel-kotlin-sdk-api = { module = "io.opentelemetry.kotlin:sdk-api", version.ref = "opentelemetryKotlin" }
otel-kotlin-implementation = { module = "io.opentelemetry.kotlin:implementation", version.ref = "opentelemetryKotlin" }
otel-kotlin-exporters-core = { module = "io.opentelemetry.kotlin:exporters-core", version.ref = "opentelemetryKotlin" }
otel-kotlin-exporters-otlp = { module = "io.opentelemetry.kotlin:exporters-otlp", version.ref = "opentelemetryKotlin" }
otel-kotlin-exporters-persistence = { module = "io.opentelemetry.kotlin:exporters-persistence", version.ref = "opentelemetryKotlin" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
opentelemetry-ktor = { module = "io.opentelemetry.instrumentation:opentelemetry-ktor-3.0", version.ref = "opentelemetryInstrumentation" }
ktor-serverAuth = { module = "io.ktor:ktor-server-auth-jvm", version.ref = "ktor" }
ktor-serverAuthJwt = { module = "io.ktor:ktor-server-auth-jwt-jvm", version.ref = "ktor" }
ktor-serverContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serverCors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serverStatusPages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-serverCallLogging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-serverCallId = { module = "io.ktor:ktor-server-call-id", version.ref = "ktor" }
ktor-serverRateLimit = { module = "io.ktor:ktor-server-rate-limit", version.ref = "ktor" }
ktor-serverWebsockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }

coil = { module = "io.coil-kt.coil3:coil-compose", version = "3.3.0" }
coil-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version = "3.3.0" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# WiretapKMP — debug-only network inspector (HTTP/WS/SSE) with a built-in UI.
# `wiretap-ktor` is the real plugin + launcher; `wiretap-ktor-noop` is the
# zero-overhead release stand-in with the identical API surface (so common
# code compiles against either). Swapped per-build: Android via
# debug/releaseImplementation, iOS via the `cards.wiretap.ios` property.
# See libraries/networking/impl/build.gradle.kts.
wiretap-ktor = { module = "dev.skymansandy:wiretap-ktor", version.ref = "wiretap" }
wiretap-ktor-noop = { module = "dev.skymansandy:wiretap-ktor-noop", version.ref = "wiretap" }

# Supabase KMP — used client-side for auth (anon sign-in, OAuth claim flow,
# session storage, token refresh). The server does NOT use supabase-kt;
# it talks to Postgres directly via JDBC and verifies JWTs by shared secret.
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt", version.ref = "supabaseKt" }

google-play-review = { module = "com.google.android.play:review", version = "2.0.2" }
google-play-review-ktx = { module = "com.google.android.play:review-ktx", version = "2.0.2" }
google-play-billing-ktx = { module = "com.android.billingclient:billing-ktx", version = "9.1.0" }


androidx-datastore-core = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "roomGradlePlugin" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
buildconfig-gradlePlugin = { module = "com.github.gmazzo.buildconfig:plugin", version.ref = "buildconfig" }

android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
# The Kotlin 2.x Compose *compiler* plugin, separate from the Compose Multiplatform
# plugin above. build-logic needs it on the classpath to reach the `composeCompiler`
# extension and turn on the stability / skippability reports.
composeCompiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
jetbrains-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jetbrainsNavigationCompose" }
anvil-runtime = { module = "software.amazon.lastmile.kotlin.inject.anvil:runtime", version.ref = "kotlinInjectAnvil" }
anvil-runtime-optional = { module = "software.amazon.lastmile.kotlin.inject.anvil:runtime-optional", version.ref = "kotlinInjectAnvil" }

compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
compottie-lite = { module = "io.github.alexzhirkevich:compottie-lite", version.ref = "compottie" }
compottie-dot = { module = "io.github.alexzhirkevich:compottie-dot", version.ref = "compottie" }
compottie-network = { module = "io.github.alexzhirkevich:compottie-network", version.ref = "compottie" }
compottie-resources = { module = "io.github.alexzhirkevich:compottie-resources", version.ref = "compottie" }

# Cant be defined under plugings because the build logic module needs to depend on them to propagate the version to the convention plugins (which cant specify a version for whatever reason)
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
kotlinx-serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
