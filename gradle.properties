#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# iOS simulator builds run on Apple Silicon unless overridden by Xcode
compose.ios.resources.platform=iphonesimulator
compose.ios.resources.archs=arm64
xcodeTargetArchs=arm64

# Cards game server: local-dev toggle.
# When true, the client targets the dev's own machine (./gradlew :apps:server:run),
# picking http://localhost:8080 on iOS or http://10.0.2.2:8080 on Android at runtime.
# When false, the client uses hardcoded dev/prod URLs in ServerInfo.kt, switched
# by build type.
#
# Override per-machine by setting `server.useLocal=true` in local.properties —
# don't flip it here. CI builds fail if this value lands as true on a branch
# (guarded in build-logic/.../Versioning.kt#loadServerMetadata).
server.useLocal=false