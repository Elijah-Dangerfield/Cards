#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Kotlin/Native compiler heap when it runs out-of-process. In practice the K/N
# compile runs INSIDE the Gradle daemon here, so the release-link OOM fix lives
# in beta.yml / release.yml (10g daemon on an xlarge runner, 2026-07-08); this
# stays as belt-and-suspenders for out-of-process execution.
kotlin.native.jvmArgs=-Xmx5g

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# iOS simulator builds run on Apple Silicon unless overridden by Xcode
compose.ios.resources.platform=iphonesimulator
compose.ios.resources.archs=arm64
xcodeTargetArchs=arm64

# Cards game server: local-dev toggle.
# When true, the client targets the dev's own machine (./gradlew :apps:server:run),
# picking http://localhost:8080 on iOS or http://10.0.2.2:8080 on Android at runtime.
# When false, the client uses the Environment URL (dev/prod) picked by build type.
#
# Override per-machine by setting `server.useLocal=true` in local.properties —
# don't commit flips. CI builds fail if this value lands as true on a branch
# (guarded in build-logic/.../Versioning.kt#loadServerMetadata).
server.useLocal=false

# Cards backend environment override.
# Empty (default) → pick by build type: debug builds hit dev, release builds hit
# prod (see Environment.current). Set to `dev` or `prod` to force a target — handy
# for pointing a local debug build at prod to test. Like server.useLocal, override
# per-machine in local.properties and never commit a flip: CI fails if a non-empty
# value lands on a branch (guarded in Versioning.kt#loadServerMetadata).
cards.targetEnv=