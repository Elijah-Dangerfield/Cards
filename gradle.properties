#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# iOS simulator builds run on Apple Silicon unless overridden by Xcode
compose.ios.resources.platform=iphonesimulator
compose.ios.resources.archs=arm64
xcodeTargetArchs=arm64

# Cards game server (checked-in team default).
# The client reads this via CardsBuildConfig.SERVER_BASE_URL at build time.
# Resolution precedence (see build-logic/.../Versioning.kt#loadServerMetadata):
#   1. server.baseUrl in local.properties (per-dev override, gitignored)
#   2. CARDS_SERVER_BASE_URL env var (CI / shell override)
#   3. This value
# To target your local Ktor server (./gradlew :apps:server:run), don't edit
# this file — drop ONE of these into local.properties:
#   server.useLocal=true               # easy mode: picks platform-correct
#                                      #   loopback (localhost:8080 on iOS,
#                                      #   10.0.2.2:8080 on Android)
#   server.baseUrl=<explicit url>      # for ngrok, staging, teammate's IP, etc.
# Then resync Gradle.
server.baseUrl=https://cards-server-dev.fly.dev