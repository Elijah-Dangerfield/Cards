# ─────────────────────────────────────────────────────────────────────────────
# Server deploy to Fly.io.
#
# Fires on:    push to main, only when something under apps/server/** changes.
# Side effects: deploys cards-server-dev. (cards-server-prod deploys via
#              server-deploy-prod.yml, gated on a human approval.)
# Auth:        FLY_API_TOKEN_DEV secret, created via
#                `fly tokens create deploy -a cards-server-dev --expiry 8760h`
#              and pasted into Repo Settings → Secrets and variables → Actions.
#
# See apps/server/DEPLOY.md for the one-time setup walkthrough.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy server (dev)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      # The hosted admin console ships inside the server image, so console
      # changes redeploy the server too.
      - 'apps/admin/**'
      - 'build-logic/**'
      # The admin bundle is built from this lock and ships inside the
      # server image, so a lock change is a deploy-worthy change.
      - 'kotlin-js-store/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/server-deploy.yml'

concurrency:
  # If multiple deploys queue up, run the latest only.
  group: server-deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Fly (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt-and-suspenders: even if someone pushes a broken server past
      # CI (force-push, branch-protection bypass, label-skipped checks),
      # we run the suite here and refuse to deploy on failure. Postgres
      # comes up via testcontainers, so Docker on the runner is required.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run server tests
        run: ./gradlew :apps:server:test

      # Build the admin console bundle on this runner and stage it where the
      # Dockerfile's runtime COPY picks it up. Deliberately NOT part of the
      # in-container Gradle build — that build runs serverOnly on a tight
      # memory budget and must not grow a Node/webpack toolchain.
      - name: Build admin console bundle
        run: |
          ./gradlew :apps:admin:jsBrowserDistribution
          cp -R apps/admin/build/dist/js/productionExecutable/. apps/server/admin-web/
          ls apps/server/admin-web/

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # --local-only: build the image on this runner (16GB, isolated) instead
        # of Fly's shared remote builder — dev + prod deploying together on one
        # builder OOM-killed both Gradle builds repeatedly (2026-07-08).
        # --build-arg COMMIT_SHA: the build container has no .git, so without
        # this the image bakes COMMIT_SHA="unknown" and /_health can't say what
        # it's running. See apps/server/Dockerfile.
        run: |
          flyctl deploy \
            --config apps/server/fly.toml \
            --local-only \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg COMMIT_BRANCH=${{ github.ref_name }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}

      - name: Smoke test
        run: |
          # Give Fly's edge proxy a beat to route to the new machine.
          sleep 5
          curl --fail --silent --show-error \
               --max-time 20 \
               https://cards-server-dev.fly.dev/_health
          echo

      # The deploy "succeeding" has never meant the new code is serving — the
      # smoke test above only proves something answers. Now that /_health
      # reports its build, check the machine on the edge is running THIS
      # commit. Retries because a rolling deploy can have the proxy still
      # pointed at the old machine for a few seconds.
      - name: Verify the deployed build is this commit
        run: |
          expected="${GITHUB_SHA:0:12}"
          for attempt in 1 2 3 4 5 6; do
            body=$(curl --fail --silent --show-error --max-time 20 \
              https://cards-server-dev.fly.dev/_health) || body=""
            actual=$(printf '%s' "$body" | sed -n 's/.*"commitSha":"\([^"]*\)".*/\1/p')
            echo "attempt $attempt: serving '$actual', expected '$expected'"
            if [ "$actual" = "$expected" ]; then
              echo "Deployed build confirmed: $actual"
              exit 0
            fi
            sleep 5
          done
          echo "::error::cards-server-dev is serving '$actual', not '$expected' — the deploy did not take effect."
          exit 1

      # Record this build's in-code config defaults so the admin tool can answer
      # "what did version X ship with". Runs after deploy so the V77 manifest
      # table exists; re-uploading the same version is idempotent (upsert).
      # Skips (without failing the deploy) when the admin token secret is absent.
      - name: Upload config manifest
        env:
          ADMIN_TOKEN: ${{ secrets.CARDS_ADMIN_API_TOKEN_DEV }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::CARDS_ADMIN_API_TOKEN_DEV not set — skipping manifest upload"
            exit 0
          fi
          ./gradlew :apps:admin:exportConfigManifest
          status=$(curl --silent --show-error --max-time 30 \
            -o /tmp/manifest-response.json -w "%{http_code}" \
            -X PUT https://cards-server-dev.fly.dev/v1/admin/config/manifest \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data @apps/admin/build/config-manifest.json)
          echo "Manifest upload → HTTP $status"
          cat /tmp/manifest-response.json; echo
          if [ "$status" != "200" ]; then
            # Don't fail an otherwise-healthy server deploy over the manifest (a
            # secondary record). Most likely the GH secret and the server's
            # ADMIN_API_TOKEN don't match — re-upload manually, or rotate both.
            echo "::warning::Config manifest upload failed (HTTP $status) — server deploy still succeeded."
          fi
