# ─────────────────────────────────────────────────────────────────────────────
# Server deploy to Fly.io.
#
# Fires on:    push to main, only when something under apps/server/** changes.
# Side effects: deploys cards-server-dev. (cards-server / prod is a separate
#              workflow when we ship.)
# Auth:        FLY_API_TOKEN_DEV secret, created via
#                `fly tokens create deploy -a cards-server-dev --expiry 8760h`
#              and pasted into Repo Settings → Secrets and variables → Actions.
#
# See apps/server/DEPLOY.md for the one-time setup walkthrough.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy server (dev)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/server-deploy.yml'

concurrency:
  # If multiple deploys queue up, run the latest only.
  group: server-deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Fly (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt-and-suspenders: even if someone pushes a broken server past
      # CI (force-push, branch-protection bypass, label-skipped checks),
      # we run the suite here and refuse to deploy on failure. Postgres
      # comes up via testcontainers, so Docker on the runner is required.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run server tests
        run: ./gradlew :apps:server:test

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # --local-only: build the image on this runner (16GB, isolated) instead
        # of Fly's shared remote builder — dev + prod deploying together on one
        # builder OOM-killed both Gradle builds repeatedly (2026-07-08).
        run: |
          flyctl deploy \
            --config apps/server/fly.toml \
            --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}

      - name: Smoke test
        run: |
          # Give Fly's edge proxy a beat to route to the new machine.
          sleep 5
          curl --fail --silent --show-error \
               --max-time 20 \
               https://cards-server-dev.fly.dev/_health
          echo

      # Record this build's in-code config defaults so the admin tool can answer
      # "what did version X ship with". Runs after deploy so the V77 manifest
      # table exists; re-uploading the same version is idempotent (upsert).
      # Skips (without failing the deploy) when the admin token secret is absent.
      - name: Upload config manifest
        env:
          ADMIN_TOKEN: ${{ secrets.CARDS_ADMIN_API_TOKEN_DEV }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::CARDS_ADMIN_API_TOKEN_DEV not set — skipping manifest upload"
            exit 0
          fi
          ./gradlew :apps:admin:exportConfigManifest
          status=$(curl --silent --show-error --max-time 30 \
            -o /tmp/manifest-response.json -w "%{http_code}" \
            -X PUT https://cards-server-dev.fly.dev/v1/admin/config/manifest \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data @apps/admin/build/config-manifest.json)
          echo "Manifest upload → HTTP $status"
          cat /tmp/manifest-response.json; echo
          if [ "$status" != "200" ]; then
            # Don't fail an otherwise-healthy server deploy over the manifest (a
            # secondary record). Most likely the GH secret and the server's
            # ADMIN_API_TOKEN don't match — re-upload manually, or rotate both.
            echo "::warning::Config manifest upload failed (HTTP $status) — server deploy still succeeded."
          fi
