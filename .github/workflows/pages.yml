# ─────────────────────────────────────────────────────────────────────────────
# Builds the Astro marketing site under website/ and publishes it to GitHub Pages
# at the custom domain https://downcard.app (CNAME lives in website/public/).
#
# Fires on:     Pushes to main that touch website/** or this workflow.
#               Also workflow_dispatch for manual re-publish.
# Side effects: Updates the live site at https://downcard.app
#               (the app's privacy/terms/support links point here — see
#               libraries/core/.../LegalUrls.kt).
# Edit to change: content lives in website/src/. Run `npm run dev` inside website/
#                 to preview locally. The repo's Pages source must be set to the
#                 "GitHub Actions" source for this workflow to deploy.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
