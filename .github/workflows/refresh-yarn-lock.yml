# ─────────────────────────────────────────────────────────────────────────────
# Regenerate kotlin-js-store/yarn.lock ON THE RUNNER, then open a PR with it.
#
# Why this exists: the admin console is Kotlin/JS, and `:apps:admin:
# jsBrowserDistribution` runs `kotlinStoreYarnLock`, which fails the build when
# the resolved lock differs from the committed one. The committed lock is
# generated by whoever last ran the task locally — on macOS — and Linux CI
# resolves a different tree, so the deploy fails with:
#
#     > Task :kotlinStoreYarnLock FAILED
#     > Lock file was changed. Run the `kotlinUpgradeYarnLock` task to actualize
#
# That broke every server deploy from 2026-07-23 (PR #131) onward, including
# the one carrying the ENG-45 progression fix. Regenerating locally can't fix
# it: the lock has to be produced on the same OS the deploy runs on.
#
# Fires on:     workflow_dispatch only. This is a maintenance button, not
#               something that should run on every push.
# Side effects: pushes a branch and opens a PR into develop. Never commits to
#               develop or main directly — a dependency lock is exactly the
#               file you want a human to glance at before it lands.
# No-ops when:  the lock is already correct for Linux, which is the healthy
#               steady state. The run says so and exits green.
#
# If this ends up needed often, the real fix is to stop generating the lock on
# developer machines at all: make `kotlinUpgradeYarnLock` a CI-only operation
# and treat the committed lock as a Linux artifact.
# ─────────────────────────────────────────────────────────────────────────────

name: Refresh yarn lock (Linux)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-yarn-lock
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate yarn.lock on ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Regenerate the lock
        run: ./gradlew kotlinUpgradeYarnLock

      # Prove the regenerated lock actually satisfies the check that was
      # failing. Without this the PR could land a lock that still doesn't
      # match, and the next deploy would fail identically.
      - name: Verify the deploy's own build now passes
        run: ./gradlew :apps:admin:jsBrowserDistribution

      - name: Open a PR if the lock changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- kotlin-js-store/yarn.lock; then
            echo "### yarn.lock already correct for Linux" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to do. If a server deploy is still failing at \`kotlinStoreYarnLock\`, the cause is something other than lock drift." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="chore/refresh-yarn-lock-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add kotlin-js-store/yarn.lock
          git commit -m "chore(build): regenerate yarn.lock on Linux

          The committed lock was generated on macOS, so kotlinStoreYarnLock
          failed on the Linux runner and took every server deploy with it from
          2026-07-23 onward. Regenerated by the refresh-yarn-lock workflow on
          ubuntu-latest, and :apps:admin:jsBrowserDistribution verified green
          on the same runner before this was committed."
          git push origin "$branch"

          gh pr create \
            --base develop \
            --head "$branch" \
            --title "chore(build): regenerate yarn.lock on Linux" \
            --body "Unblocks the server deploy.

          \`kotlinStoreYarnLock\` compares the resolved lock against the committed one and fails the build when they differ. The committed lock was produced on macOS; the deploy runs on \`ubuntu-latest\` and resolves a different tree, so every server deploy since 2026-07-23 (PR #131) has failed before reaching Fly.

          This lock was regenerated on \`ubuntu-latest\`, and \`:apps:admin:jsBrowserDistribution\` — the exact step the deploy runs — was verified green on the same runner before committing.

          Review the diff as you would any dependency change: this bundle ships inside the server image, and the repo is public.

          Generated by [refresh-yarn-lock.yml](.github/workflows/refresh-yarn-lock.yml)."

          {
            echo "### Opened a PR with the regenerated lock"
            echo
            echo "Branch \`$branch\` → \`develop\`."
            echo
            echo '```diff'
            git diff HEAD~1 -- kotlin-js-store/yarn.lock | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
