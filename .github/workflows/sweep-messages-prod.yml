# ─────────────────────────────────────────────────────────────────────────────
# Daily sweep of acked + expired user_messages rows (PRODUCTION).
#
# Calls POST /v1/admin/sweep-expired-messages once a day. The endpoint
# drops:
#   - Every acked row (regardless of age) — once seen + acked, it's dead weight.
#   - Unacked rows whose `expires_at` has passed — the unread-fetch
#     filter already hides these client-side, so deletion is cleanup.
#
# This ran against **dev** until 2026-09-04, which was backwards. Dev's
# user_messages table is a handful of rows written by hand while testing the
# admin workflows — nothing accumulates there, so the sweep had nothing to do
# and its result told us nothing. Prod is where real players ack real messages
# and where expired rows actually pile up, and it had no sweep at all. Same job,
# pointed at the environment that needed it.
#
# A spike in `expiredUnackedPurged` is worth investigating: it means
# users weren't seeing their notices in time (TTL too short, or app
# engagement dropped). The endpoint returns counts in the response;
# the workflow surfaces them in the run summary.
#
# No `confirm` gate, unlike the other prod admin workflows. Those write to a
# real player's account on a human's say-so, so they make you type PROD. This
# only deletes rows the client already treats as gone, and a cron cannot type
# anything into a box.
#
# Cadence: once a day at an odd minute (storage hygiene doesn't need
# tight scheduling, and odd minutes dodge the top-of-hour cron stampede).
#
# Auth: shares CARDS_ADMIN_API_TOKEN_PROD with the other prod admin endpoints.
# ─────────────────────────────────────────────────────────────────────────────

name: Sweep expired messages (prod)

on:
  schedule:
    - cron: '23 4 * * *'   # 04:23 UTC daily
  workflow_dispatch:

concurrency:
  group: sweep-messages-prod
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep
    runs-on: ubuntu-latest
    steps:
      - name: Call admin sweep endpoint
        env:
          ADMIN_TOKEN: ${{ secrets.CARDS_ADMIN_API_TOKEN_PROD }}
        run: |
          set -euo pipefail

          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::CARDS_ADMIN_API_TOKEN_PROD secret is not set"
            exit 1
          fi

          response_file="$(mktemp)"
          status=$(curl --silent --show-error --max-time 30 \
            -o "$response_file" -w "%{http_code}" \
            -X POST \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            https://cards-server-prod.fly.dev/v1/admin/sweep-expired-messages)

          echo "HTTP $status"
          cat "$response_file"
          echo

          {
            echo "### Sweep result"
            echo
            echo "- **HTTP:** $status"
            echo
            echo '```json'
            jq . < "$response_file" 2>/dev/null || cat "$response_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" != "200" ]; then
            echo "::error::Endpoint returned HTTP $status"
            exit 1
          fi
