# ─────────────────────────────────────────────────────────────────────────────
# Daily sweep of acked + expired user_messages rows (dev).
#
# Calls POST /v1/admin/sweep-expired-messages once a day. The endpoint
# drops:
#   - Every acked row (regardless of age) — once seen + acked, it's dead weight.
#   - Unacked rows whose `expires_at` has passed — the unread-fetch
#     filter already hides these client-side, so deletion is cleanup.
#
# A spike in `expiredUnackedPurged` is worth investigating: it means
# users weren't seeing their notices in time (TTL too short, or app
# engagement dropped). The endpoint returns counts in the response;
# the workflow surfaces them in the run summary.
#
# Cadence: once a day at an odd minute (storage hygiene doesn't need
# tight scheduling, and odd minutes dodge the top-of-hour cron stampede).
#
# Auth: shares ADMIN_API_TOKEN with the other admin endpoints.
# ─────────────────────────────────────────────────────────────────────────────

name: Sweep expired messages (dev)

on:
  schedule:
    - cron: '23 4 * * *'   # 04:23 UTC daily
  workflow_dispatch:

concurrency:
  group: sweep-messages-dev
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep
    runs-on: ubuntu-latest
    steps:
      - name: Call admin sweep endpoint
        env:
          ADMIN_TOKEN: ${{ secrets.CARDS_ADMIN_API_TOKEN_DEV }}
        run: |
          set -euo pipefail

          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::CARDS_ADMIN_API_TOKEN_DEV secret is not set"
            exit 1
          fi

          response_file="$(mktemp)"
          status=$(curl --silent --show-error --max-time 30 \
            -o "$response_file" -w "%{http_code}" \
            -X POST \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            https://cards-server-dev.fly.dev/v1/admin/sweep-expired-messages)

          echo "HTTP $status"
          cat "$response_file"
          echo

          {
            echo "### Sweep result"
            echo
            echo "- **HTTP:** $status"
            echo
            echo '```json'
            jq . < "$response_file" 2>/dev/null || cat "$response_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" != "200" ]; then
            echo "::error::Endpoint returned HTTP $status"
            exit 1
          fi
