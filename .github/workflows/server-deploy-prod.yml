# ─────────────────────────────────────────────────────────────────────────────
# Server deploy to Fly.io — PRODUCTION (cards-server-prod).
#
# Release model: the server is continuously deployed, INDEPENDENT of the mobile
# app release (release-please / release.yml). Coordinate breaking client⇄server
# changes with config flags, not lockstep deploys. See
# docs/branching-and-release-strategy.md → "Server release model".
#
# Fires on:    push to main (server-affecting paths) — auto-QUEUES a prod deploy
#              that PAUSES on the `production` GitHub Environment until a human
#              approves it (Actions → the run → "Review deployments"). Dev has
#              already auto-deployed by then, so the approver verifies dev looks
#              good, then one-click approves prod. Also `workflow_dispatch` as a
#              break-glass / redeploy button.
# Auth:        FLY_API_TOKEN_PROD secret, created via
#                `fly tokens create deploy -a cards-server-prod --expiry 8760h`.
#
# See apps/server/DEPLOY.md for the two-environment setup walkthrough.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy server (prod)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/server-deploy-prod.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "prod" to confirm you mean to deploy production.'
        required: true
        default: ''

jobs:
  deploy:
    name: Deploy to Fly (prod)
    runs-on: ubuntu-latest
    # The gate: this Environment requires a reviewer's approval, so the job
    # pauses here until a human approves. Both push and manual runs go through it.
    environment: production
    # Concurrency lives on the JOB, not the workflow, on purpose. A run parked
    # at the approval gate above hasn't started this job, so it doesn't hold
    # the slot — an unapproved deploy can sit there forever without blocking
    # newer runs from reaching the gate. (Workflow-level concurrency is exactly
    # how the first-ever prod run, never approved, silently plugged the queue
    # from 2026-06-27 to 2026-07-07: every later run stayed jobless-"pending"
    # and each new push cancelled the previous one.) Approved deploys still
    # serialize here, and a prod deploy is never cancelled mid-flight.
    concurrency:
      group: server-deploy-prod
      cancel-in-progress: false
    steps:
      - name: Guard — require explicit confirmation (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm != 'prod' }}
        run: |
          echo "Refusing to deploy: type 'prod' in the confirm input to proceed."
          exit 1

      - uses: actions/checkout@v4

      # Same belt-and-suspenders as dev: run the suite and refuse to deploy on
      # failure. Postgres comes up via testcontainers, so Docker is required.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run server tests
        run: ./gradlew :apps:server:test

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # --local-only: build the image on this runner (16GB, isolated) instead
        # of Fly's shared remote builder — dev + prod deploying together on one
        # builder OOM-killed both Gradle builds repeatedly (2026-07-08).
        run: |
          flyctl deploy \
            --config apps/server/fly.prod.toml \
            --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}

      - name: Smoke test
        run: |
          sleep 5
          curl --fail --silent --show-error \
               --max-time 20 \
               https://cards-server-prod.fly.dev/_health
          echo

      # Record this build's in-code config defaults (see the dev workflow). Skips
      # without failing the deploy until CARDS_ADMIN_API_TOKEN_PROD is created —
      # prod's admin surface isn't fully wired yet.
      - name: Upload config manifest
        env:
          ADMIN_TOKEN: ${{ secrets.CARDS_ADMIN_API_TOKEN_PROD }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::CARDS_ADMIN_API_TOKEN_PROD not set — skipping manifest upload"
            exit 0
          fi
          ./gradlew :apps:admin:exportConfigManifest
          status=$(curl --silent --show-error --max-time 30 \
            -o /tmp/manifest-response.json -w "%{http_code}" \
            -X PUT https://cards-server-prod.fly.dev/v1/admin/config/manifest \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data @apps/admin/build/config-manifest.json)
          echo "Manifest upload → HTTP $status"
          cat /tmp/manifest-response.json; echo
          if [ "$status" != "200" ]; then
            # Don't fail an otherwise-healthy server deploy over the manifest (a
            # secondary record). Most likely the GH secret and the server's
            # ADMIN_API_TOKEN don't match — re-upload manually, or rotate both.
            echo "::warning::Config manifest upload failed (HTTP $status) — server deploy still succeeded."
          fi
