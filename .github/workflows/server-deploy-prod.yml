# ─────────────────────────────────────────────────────────────────────────────
# Server deploy to Fly.io — PRODUCTION (cards-server-prod).
#
# Release model: the server is continuously deployed, INDEPENDENT of the mobile
# app release (release-please / release.yml). Coordinate breaking client⇄server
# changes with config flags, not lockstep deploys. See
# docs/branching-and-release-strategy.md → "Server release model".
#
# Fires on:    push to main (server-affecting paths) — auto-QUEUES a prod deploy
#              that PAUSES on the `production` GitHub Environment until a human
#              approves it (Actions → the run → "Review deployments"). Dev has
#              already auto-deployed by then, so the approver verifies dev looks
#              good, then one-click approves prod. Also `workflow_dispatch` as a
#              break-glass / redeploy button.
# Auth:        FLY_API_TOKEN_PROD secret, created via
#                `fly tokens create deploy -a cards-server-prod --expiry 8760h`.
#
# See apps/server/DEPLOY.md for the two-environment setup walkthrough.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy server (prod)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      # The hosted admin console ships inside the server image, so console
      # changes redeploy the server too.
      - 'apps/admin/**'
      - 'build-logic/**'
      # The admin bundle is built from this lock and ships inside the
      # server image, so a lock change is a deploy-worthy change.
      - 'kotlin-js-store/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/server-deploy-prod.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "prod" to confirm you mean to deploy production.'
        required: true
        default: ''

jobs:
  # Cancel prod deploys that are still waiting for approval from an older
  # commit. A run parked at the gate is superseded the moment a newer one
  # queues behind it, and approving it later would deploy stale code: in
  # September two runs sat unapproved for 17 days and were cancelled rather
  # than approved for exactly that reason, because they predated the fix
  # everyone was waiting on.
  #
  # Only runs with a LOWER run number than this one, and only while they are
  # still waiting or pending, so this can never cancel itself or a deploy that
  # has started. Never fails the workflow: a tidy-up that blocks a deploy would
  # be worse than the mess it cleans.
  supersede:
    name: Cancel superseded deploys
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older runs still waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          stale=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/server-deploy-prod.yml/runs?per_page=50" \
            --jq ".workflow_runs[]
                  | select(.run_number < $GITHUB_RUN_NUMBER)
                  | select(.status == \"waiting\" or .status == \"pending\")
                  | .id")
          if [ -z "$stale" ]; then
            echo "No superseded prod deploys waiting for approval."
            exit 0
          fi
          for id in $stale; do
            echo "::warning::Cancelling superseded prod deploy run $id (never approved)."
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" \
              || echo "Could not cancel $id; continuing."
          done
          exit 0

  # The approval gate, deliberately a job of its own that does nothing.
  #
  # It used to be declared on the deploy job together with the concurrency
  # group, on the theory that a run paused for approval had not started the job
  # and so did not hold the slot. That theory is wrong: a job in `waiting`
  # occupies its concurrency group, so one unapproved run blocked every later
  # one from even reaching the gate. The later runs sat at `pending` with no
  # pending_deployment record, which is why there was nothing to approve and
  # nothing obviously broken.
  #
  # That failure plugged prod deploys three times (2026-06-27, 2026-09-04,
  # 2026-10-04), the last for 17 days while prod served old code. Moving
  # concurrency from the workflow to the job was the second attempt at a fix
  # and did not work, because it changed where the group was declared without
  # changing the fact that waiting holds it.
  #
  # Splitting them is what actually fixes it. Waiting happens here, where there
  # is no group to hold. Serialization happens in `deploy`, which is only
  # reached once a human has approved.
  gate:
    name: Await approval
    needs: supersede
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved
        run: echo "Prod deploy approved. Proceeding to build and deploy."

  deploy:
    name: Deploy to Fly (prod)
    needs: gate
    runs-on: ubuntu-latest
    # Approved deploys serialize here, and a prod deploy is never cancelled
    # mid-flight. Nothing waits in this group any more, so a queue of one is
    # the worst case.
    concurrency:
      group: server-deploy-prod
      cancel-in-progress: false
    steps:
      - name: Guard — require explicit confirmation (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm != 'prod' }}
        run: |
          echo "Refusing to deploy: type 'prod' in the confirm input to proceed."
          exit 1

      - uses: actions/checkout@v4

      # Same belt-and-suspenders as dev: run the suite and refuse to deploy on
      # failure. Postgres comes up via testcontainers, so Docker is required.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run server tests
        run: ./gradlew :apps:server:test

      # Build the admin console bundle on this runner and stage it where the
      # Dockerfile's runtime COPY picks it up. Deliberately NOT part of the
      # in-container Gradle build — that build runs serverOnly on a tight
      # memory budget and must not grow a Node/webpack toolchain.
      - name: Build admin console bundle
        run: |
          ./gradlew :apps:admin:jsBrowserDistribution
          cp -R apps/admin/build/dist/js/productionExecutable/. apps/server/admin-web/
          ls apps/server/admin-web/

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # --local-only: build the image on this runner (16GB, isolated) instead
        # of Fly's shared remote builder — dev + prod deploying together on one
        # builder OOM-killed both Gradle builds repeatedly (2026-07-08).
        run: |
          flyctl deploy \
            --config apps/server/fly.prod.toml \
            --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}

      - name: Smoke test
        run: |
          sleep 5
          curl --fail --silent --show-error \
               --max-time 20 \
               https://cards-server-prod.fly.dev/_health
          echo

      # Record this build's in-code config defaults (see the dev workflow). Skips
      # without failing the deploy until CARDS_ADMIN_API_TOKEN_PROD is created —
      # prod's admin surface isn't fully wired yet.
      - name: Upload config manifest
        env:
          ADMIN_TOKEN: ${{ secrets.CARDS_ADMIN_API_TOKEN_PROD }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::CARDS_ADMIN_API_TOKEN_PROD not set — skipping manifest upload"
            exit 0
          fi
          ./gradlew :apps:admin:exportConfigManifest
          status=$(curl --silent --show-error --max-time 30 \
            -o /tmp/manifest-response.json -w "%{http_code}" \
            -X PUT https://cards-server-prod.fly.dev/v1/admin/config/manifest \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data @apps/admin/build/config-manifest.json)
          echo "Manifest upload → HTTP $status"
          cat /tmp/manifest-response.json; echo
          if [ "$status" != "200" ]; then
            # Don't fail an otherwise-healthy server deploy over the manifest (a
            # secondary record). Most likely the GH secret and the server's
            # ADMIN_API_TOKEN don't match — re-upload manually, or rotate both.
            echo "::warning::Config manifest upload failed (HTTP $status) — server deploy still succeeded."
          fi
