# ─────────────────────────────────────────────────────────────────────────────
# PR gate. Compiles both platforms and runs unit tests.
#
# Fires on:     PRs and pushes to main (ignores docs-only changes and
#               CHANGELOG.md, since release-please commits to CHANGELOG.md).
# Skips:        release-please's PR and its merge commit — bumps-only
#               changes can't break the build.
# Side effects: uploads JUnit/HTML test reports as artifacts (14 days,
#               always — green or red, so post-mortem on a failed test
#               doesn't require re-running locally) and the debug APK
#               on push-to-main only (30 days). PR runs upload reports
#               but not APKs. Each test job publishes its own JUnit XML as an
#               inline check via dorny/test-reporter ("Unit test results",
#               "Server test results", "Integration test results") with
#               pass/fail counts + click-through to failures. Ship by
#               cutting a release via the release-please PR → release.yml.
# Edit to change: compile commands or the test task below.
# See: docs/practices/release.md → "Cutting a release (for humans)"
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
  # Keep the Actions caches alive. GitHub evicts any cache not *accessed* for
  # 7 days, and this repo ships in bursts — nothing ran between 2026-09-21 and
  # 09-28, so every entry was evicted and the next macOS build started from
  # nothing. Twice weekly, not weekly, because a 7-day job against a 7-day
  # eviction window has no margin: Monday and Thursday means at most four days
  # of silence. Runs on `main`, and PR runs restore from the default branch, so
  # warming it here warms every PR. macOS minutes are free on a public repo.
  schedule:
    - cron: '37 4 * * 1,4'
  # Manual recovery. If the cache is ever cold again, this is the button that
  # reseeds it without waiting for a release or inventing a dummy commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each test job's dorny/test-reporter step posts an inline check with pass/fail
# counts and failing-test detail, so a red run doesn't require downloading the
# artifact zip. checks:write is needed to publish those checks.
permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build + test
    # release-please's PR only changes versionName + CHANGELOG — it can't break
    # the build. Skip the expensive macOS run on that branch AND on its merge
    # commit into main (squash = "chore: release …", merge commit = "Merge
    # pull request #N from …/release-please--branches--main").
    if: >
      github.head_ref != 'release-please--branches--main' &&
      !startsWith(github.event.head_commit.message, 'chore: release') &&
      !contains(github.event.head_commit.message, 'release-please--branches')
    runs-on: macos-26
    # 90, not 45. A timeout exists to kill a *hung* job, and a cold build is
    # slow rather than hung: warm it is ~16 min, cold it is 22 min of compile
    # plus 17 of assemble plus tests, which does not fit in 45.
    #
    # The old ceiling did not just fail those runs, it made the failure
    # permanent. A cancelled job never reaches "Post Set up Gradle", so it
    # never saves the cache it would have warmed — cold begets timeout begets
    # cold. On 2026-09-28 that deadlock had PRs #157 and #158 red for two weeks
    # with nothing actually broken in them, and the release PR passed with 35
    # seconds to spare. Give a cold build room to finish and seed the cache.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select runner's default Xcode
        run: |
          if [ ! -d /Applications/Xcode.app ]; then
            echo "::error::/Applications/Xcode.app is missing on runner"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode.app
          echo "Using /Applications/Xcode.app"
          xcodebuild -version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PRs read the cache but must not write it, so one branch's odd
          # dependency set can't poison everyone else's builds. `develop` used
          # to be the exception, because the develop -> main release PR was the
          # most expensive run we had and writing from it kept the macOS cache
          # warm. With develop gone (2026-10-04) every PR is a feature branch,
          # so the push-to-main run and the twice-weekly schedule below are what
          # keep the cache alive. If cold-cache timeouts come back, that is the
          # first thing to revisit.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # Prune unused files before saving. The repo cache sits around 7GB of
          # a 10GB cap across ~44 entries, and when it overflows GitHub evicts
          # least-recently-used — which is exactly how the macOS entry went
          # missing while the smaller Linux ones survived.
          gradle-home-cache-cleanup: true

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-xcode26-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-xcode26-

      - name: Compile Android + iOS Kotlin targets
        run: ./gradlew :apps:compose:compileDebugKotlinAndroid :apps:compose:compileKotlinIosSimulatorArm64

      - name: Assemble Android debug
        run: ./gradlew :apps:compose:assembleDebug

      - name: Run unit tests
        # The end-to-end :apps:integration tests run in their own job (cheaper
        # Ubuntu runner, no Xcode/iOS needed) so a slower e2e can't blur the
        # unit-test signal — exclude them from this sweep to avoid running twice.
        run: ./gradlew testDebugUnitTest -x :apps:integration:testDebugUnitTest

      - name: Publish unit test results
        # Parses the JUnit XML and posts an inline "Unit test results" check
        # with pass/fail counts + click-through to failing assertions, so a red
        # run doesn't require downloading the artifact zip. Informational only —
        # `Build + test` is the gating check.
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit test results
          path: '**/build/test-results/testDebugUnitTest/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-unit-test-reports
          path: |
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        # PR runs skip — keeps artifact storage focused on green main builds
        # that someone might actually want to sideload for repro.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/compose/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

  server-test:
    name: Server tests
    # Runs in parallel with build-and-test on a cheap Ubuntu runner so the
    # testcontainers Postgres can spin up — macOS runners don't ship with
    # the Docker daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run server tests
        run: ./gradlew :apps:server:test

      - name: Publish server test results
        # Inline "Server test results" check with pass/fail counts +
        # failing-test detail. Informational only — `Server tests` gates.
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Server test results
          path: 'apps/server/build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload server test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            apps/server/build/test-results/test/*.xml
            apps/server/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Android lint
    # Android Lint had never run in this repo. The first pass found four real
    # errors across three modules: two NewApi (a StrictMode Violation in a
    # method signature, and windowSplashScreenBackground outside a -v31 folder)
    # and three MissingPermission on ACCESS_NETWORK_STATE, which the app only
    # had because androidx.work happened to declare it. All four were fixed
    # rather than baselined, so this job starts from a clean report and any
    # failure here is new. Ubuntu: lint needs the Android SDK, not Xcode.
    #
    # Worth knowing what this does NOT catch: lint saw nothing wrong with the
    # code behind CARDS-CK, because it understands the SDK_INT guard around the
    # API *call* and does not model the signature resolution that actually
    # broke. Verified by running lint against that exact commit. The gate is
    # still worth having; it is just not the thing that would have caught it.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run Android lint
        run: ./gradlew lintRelease

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/intermediates/lint_intermediate_text_report/**/*.txt
          if-no-files-found: ignore
          retention-days: 14

  integration-test:
    name: Integration tests
    # End-to-end multiplayer tests: a real client (+ real view models) driven
    # against a real in-process Ktor server. Runs as Android unit tests on the
    # host JVM, so it needs the Android SDK (preinstalled on the runner) but no
    # Xcode/iOS — hence a cheap Ubuntu runner, separate from the macOS client
    # build. No Docker: storage is in-memory and auth is stubbed (unlike the
    # Postgres-backed server-test job).
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run integration tests
        run: ./gradlew :apps:integration:testDebugUnitTest

      - name: Publish integration test results
        # Inline "Integration test results" check with pass/fail counts +
        # failing-test detail. Informational only — `Integration tests` gates.
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration test results
          path: 'apps/integration/build/test-results/testDebugUnitTest/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            apps/integration/build/test-results/testDebugUnitTest/*.xml
            apps/integration/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
