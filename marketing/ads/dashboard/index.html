<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downcard ads</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <h1>Downcard ads</h1>
        <p class="meta" id="meta"></p>
      </div>
      <span class="source-badge" id="source-badge" hidden>Example data</span>
    </header>

    <div id="empty" class="empty" hidden>
      <h2>No data yet</h2>
      <p>Run <code>/ad-report</code> in Claude Code to pull your ad numbers, or open <a href="?example">the example</a> to see what this looks like.</p>
    </div>

    <div id="content" hidden>
      <section class="next" id="next">
        <p class="eyebrow">Do next</p>
        <h2 id="next-title"></h2>
        <p id="next-why"></p>
      </section>

      <p class="headline" id="headline"></p>

      <section class="tiles" id="tiles" aria-label="Totals"></section>

      <section class="charts">
        <figure class="card chart-card">
          <figcaption>
            <h3>Spend over time</h3>
            <p class="sub">Lifetime spend per platform at each pull</p>
          </figcaption>
          <div class="legend" id="spend-legend"></div>
          <div class="chart" id="spend-chart"></div>
        </figure>
        <figure class="card chart-card">
          <figcaption>
            <h3>Cost per install</h3>
            <p class="sub">Spend divided by App Store installs. Lower is better.</p>
          </figcaption>
          <div class="legend" id="cpi-legend"></div>
          <div class="chart" id="cpi-chart"></div>
        </figure>
      </section>

      <section class="card">
        <h3>Every ad</h3>
        <div class="table-wrap">
          <table id="ads-table">
            <thead>
              <tr>
                <th scope="col">Ad</th>
                <th scope="col">Verdict</th>
                <th scope="col" class="num">Spent</th>
                <th scope="col" class="num">Clicks</th>
                <th scope="col" class="num">CTR</th>
                <th scope="col" class="num">Per click</th>
                <th scope="col" class="num">Installs</th>
                <th scope="col" class="num">Per install</th>
                <th scope="col" class="num" title="Share of impressions still watching at 2 seconds">Hook</th>
                <th scope="col" class="num" title="Of those hooked, share still watching at 6 seconds">Hold</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="creative-section" hidden>
        <h3 class="section-title">What the videos say</h3>
        <div class="cards" id="creative-notes"></div>
      </section>

      <section id="experiments-section" hidden>
        <h3 class="section-title">Try next</h3>
        <div class="cards" id="experiments"></div>
      </section>
    </div>
  </main>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
